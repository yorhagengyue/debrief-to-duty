id: dc-cooling-loss
name: "Data hall cooling loss: first-hour judgement"
version: 1.3.0
status: superseded
effective_from: 2023-01-17T00:56:00.000Z
owner:
  role: Critical Facilities Engineering Lead
  name: Pill owner (role-played in this replay)
  role_played: true
scope:
  assets:
    - data halls cooled by chilled-water plant (chillers, pumps, chilled-water loop)
    - utility and generator power feeding that plant
  not_for:
    - IT service recovery and failover
    - fire suppression and life safety (follow the site emergency plan)
context: "Know-how for the first hour after cooling capacity is lost or at risk in a data hall: what to check, what to do next, and when a person must decide. Every rule cites the incident review sentences it comes from."
rules:
  - id: R-001
    title: Treat utility voltage swells as a cooling-plant threat, not just a power-transfer event
    when:
      - storms are active in the area and the utility feed shows voltage sags or swells
      - a portion of the datacenter has transferred from utility power to generator power
    then:
      - immediately verify that mechanical cooling systems are still running, rather than assuming surge suppressors protected them
      - if mechanical cooling has shut down, treat the datacenter as being on a load-dependent thermal buffer and start planning for its depletion
      - transfer the rest of the datacenter to generators to stabilize the power supply while storms are still active
    why: Voltage swells triggered a transfer to generator power and also shut down the mechanical cooling systems despite surge suppressors being in place; the site initially survived only on a load-dependent thermal buffer.
    escalate:
      to: facility operations lead and cooling plant engineer
      trigger: mechanical cooling confirmed shut down while storms remain active in the area
    evidence:
      - AZ-SCUS-2018:S6
      - AZ-SCUS-2018:S7
      - AZ-SCUS-2018:S8
      - AZ-SCUS-2018:S9
      - AZ-SCUS-2018:S10
      - AZ-SCUS-2018:S14
    learned_from:
      - AZ-SCUS-2018
    since: 1.0.0
  - id: R-002
    title: Act on thermal buffer depletion before automated shutdowns begin
    when:
      - mechanical cooling is down and the datacenter is running on its load-dependent thermal buffer
      - datacenter temperature is approaching safe operational thresholds
    then:
      - treat the thermal buffer as a finite resource and act before it is depleted
      - expect that once the buffer is gone, temperature will exceed safe operational thresholds and automated device shutdown will begin
      - recognize that in parts of the datacenter temperature can rise so quickly that hardware is damaged before it can shut down
    why: Once the thermal buffer was depleted the datacenter exceeded safe operational thresholds and automated shutdown began, but temperatures rose so quickly in places that some hardware was damaged before it could shut down.
    escalate:
      to: incident commander
      trigger: thermal buffer depletion is imminent or automated shutdowns have started
    evidence:
      - AZ-SCUS-2018:S10
      - AZ-SCUS-2018:S11
      - AZ-SCUS-2018:S12
    learned_from:
      - AZ-SCUS-2018
    since: 1.0.0
  - id: R-003
    title: Treat a control-system failover as a cooling-availability event, not a routine maintenance action
    when:
      - the datacenter control system is in the process of failing away from one of its control hosts
      - the control system is exchanging state information with other control systems and with cooling equipment and temperature sensors
    then:
      - treat the failover as a period of elevated risk to cooling availability and watch the cooling plant directly, not only the control system
      - expect that a fault in the control system logic during this exchange can make the control system unresponsive
      - verify that cooling systems have actually entered their designed maximum-cooling fallback rather than assuming the fallback engaged
    why: The control system was mid-failover when a bug in third-party control logic caused excessive interactions with datacenter devices and left the control system unresponsive; the designed fallback to maximum cooling did not engage everywhere.
    escalate:
      to: facility operations lead and cooling plant engineer
      trigger: control system failover in progress or control system confirmed unresponsive
    evidence:
      - AWS-NRT-2019:S22
      - AWS-NRT-2019:S23
      - AWS-NRT-2019:S24
      - AWS-NRT-2019:S25
      - AWS-NRT-2019:S26
    learned_from:
      - AWS-NRT-2019
    since: 1.1.0
  - id: R-004
    title: When the control system is down, work the cooling chain by hand and reset the PLCs
    when:
      - the datacenter control system is unavailable and operators have minimum visibility into cooling health and state
      - cooling has not transitioned to maximum cooling or purge mode in part of the datacenter
    then:
      - do not wait for the control system to come back; manually investigate the affected cooling equipment
      - check the Programmable Logic Controllers controlling the air handling units, since they can be unresponsive even when the control system is the visible failure
      - reset the affected equipment and PLCs and place them into a maximum cooling configuration
      - confirm cooling is restored and temperatures are falling before standing down
    why: The control system was unavailable, purge failed, and recovery required manually investigating and resetting all affected equipment into maximum cooling; the unresponsive PLCs controlling some air handling units were what prevented both default cooling and purge from working.
    escalate:
      to: incident commander
      trigger: temperatures are rising and servers have begun powering off
    evidence:
      - AWS-NRT-2019:S28
      - AWS-NRT-2019:S29
      - AWS-NRT-2019:S30
      - AWS-NRT-2019:S31
      - AWS-NRT-2019:S32
      - AWS-NRT-2019:S33
      - AWS-NRT-2019:S34
      - AWS-NRT-2019:S35
    learned_from:
      - AWS-NRT-2019
    since: 1.1.0
  - id: R-005
    title: Treat simultaneous failure of redundant cooling systems as a single-point-of-failure event
    when:
      - multiple cooling systems that are supposed to be redundant have failed at the same time
      - outside temperatures are extraordinarily high
    then:
      - do not assume that remaining cooling capacity is sufficient; treat the data center as unable to maintain a safe operating temperature
      - immediately assess whether the data center can maintain a safe operating temperature
      - if not, plan to power down servers to prevent an even longer outage or damage to machines
    why: The review states that one data center could not maintain a safe operating temperature due to a simultaneous failure of multiple, redundant cooling systems combined with extraordinarily high outside temperatures, and that powering down was done to prevent an even longer outage or damage.
    escalate:
      to: incident commander
      trigger: simultaneous failure of redundant cooling systems and rising temperatures
    evidence:
      - GCP-LDN-2022:S30
      - GCP-LDN-2022:S31
    learned_from:
      - GCP-LDN-2022
    since: 1.2.0
  - id: R-006
    title: Use progressive thermal load reduction before full shutdown
    when:
      - data center temperatures are increasing and cooling capacity is insufficient
      - the data center is at risk of exceeding safe operating temperatures
    then:
      - progressively decrease the thermal load within the data center space
      - consider terminating non-critical workloads such as Preemptible VMs to reduce thermal load and ensure space for zonal failover activities
      - if thermal load reduction is insufficient, power down servers to prevent an even longer outage and further impact to infrastructure
    why: The review describes terminating 42% of Preemptible VMs to reduce thermal load and ensure space for zonal failover, and later powering down servers to prevent a longer outage; it also commits to investigating more advanced methods to progressively decrease thermal load to reduce the probability of full shutdown.
    escalate:
      to: incident commander
      trigger: temperatures continue to rise despite initial load reduction
    evidence:
      - GCP-LDN-2022:S52
      - GCP-LDN-2022:S36
      - GCP-LDN-2022:S42
    learned_from:
      - GCP-LDN-2022
    since: 1.2.0
  - id: R-007
    title: Verify standby cooling is on an independent water circuit before trusting failover
    when:
      - a cooling failure has occurred and the contingency plan calls for switching to standby chillers
      - the standby chillers share a water circulation system with the active chillers
    then:
      - do not assume standby chillers will take over; confirm the standby plant draws from an independent water circuit before relying on it
      - if the standby shares the same water loop, treat the failover as likely to fail and move directly to auxiliary heat dissipation and ventilation measures
      - notify the chiller manufacturer early rather than waiting for the failover to prove ineffective
    why: Air entered the cooling system due to lack of water and affected the active chillers, but the standby chillers used the same water circulation system, so the failover failed.
    escalate:
      to: facility operations lead and chiller manufacturer
      trigger: standby chillers confirmed to share the same water circulation system as the failed active chillers
    evidence:
      - ALI-HKG-2022:S72
      - ALI-HKG-2022:S73
    learned_from:
      - ALI-HKG-2022
    since: 1.3.0
  - id: R-008
    title: Check whether chillers are bound into a cluster before attempting individual restart
    when:
      - chillers have been recirculated and gas discharged but will not restart
      - the site's chillers are configured as a bound cluster
    then:
      - recognize that individual chiller restart will not work while the chillers remain bound into a cluster
      - plan to manually modify chiller configurations to unbind them from the cluster so each can be restarted individually
      - expect that restarting chillers one after another will slow restoration of the whole cooling system
    why: After recirculating water and discharging gas, chillers could not be restarted individually because all chillers were bound into a cluster; engineers had to manually modify configurations to run them individually, and restarting one after another slowed restoration.
    escalate:
      to: chiller manufacturer's engineers
      trigger: chillers will not restart individually and are confirmed bound into a cluster
    evidence:
      - ALI-HKG-2022:S74
      - ALI-HKG-2022:S75
      - ALI-HKG-2022:S76
    learned_from:
      - ALI-HKG-2022
    since: 1.3.0
  - id: R-009
    title: Reduce IT load early to prevent fire sprinkler activation during cooling loss
    when:
      - cooling system has failed and server room temperatures are rising uncontrollably
      - temperatures are approaching the level that could trigger the fire sprinkler system
    then:
      - begin reducing loads on computing, storage, network, database, and big data clusters to slow temperature rise
      - shut down servers in rooms with high temperature
      - treat sprinkler activation as a risk that can damage power supply cabinets and server racks and complicate restoration
    why: With cooling failure, temperatures rose uncontrollably, triggering the fire sprinkler system; water entered power supply cabinets and server racks, damaging hardware and complicating restoration.
    escalate:
      to: incident commander
      trigger: temperatures continue to rise despite load reduction and sprinkler activation is possible
    evidence:
      - ALI-HKG-2022:S82
      - ALI-HKG-2022:S83
      - ALI-HKG-2022:S13
    learned_from:
      - ALI-HKG-2022
    since: 1.3.0
guardrails:
  - id: G-001
    text: Do not rely on surge suppressors alone to keep mechanical cooling available during utility voltage swells; the review records that cooling shut down despite surge suppressors being in place.
    evidence:
      - AZ-SCUS-2018:S9
    since: 1.0.0
  - id: G-002
    text: Do not assume onsite redundancies make customer workloads safe from a datacenter cooling failure; the review states there are scenarios in which a cooling failure can impact customer workloads in the affected datacenter.
    evidence:
      - AZ-SCUS-2018:S21
    since: 1.0.0
  - id: G-003
    text: Do not treat purge mode as a guaranteed independent fallback while PLCs may be unresponsive; the review records that purge failed in the affected areas because the PLC controllers were unresponsive, and that purge is only being modified to bypass PLCs in newer designs.
    evidence:
      - AWS-NRT-2019:S27
      - AWS-NRT-2019:S28
      - AWS-NRT-2019:S34
      - AWS-NRT-2019:S39
      - AWS-NRT-2019:S40
    since: 1.1.0
  - id: G-004
    text: Do not rely on the datacenter control system for visibility into cooling health during a control-system failure; the review records that the operations team had minimum visibility into cooling health and state while the control system was unavailable.
    evidence:
      - AWS-NRT-2019:S30
    since: 1.1.0
  - id: G-005
    text: Do not assume the control-system failover mode that triggered this bug is available; the review records that this failover mode has been disabled in the interim to prevent recurrence.
    evidence:
      - AWS-NRT-2019:S37
    since: 1.1.0
  - id: G-006
    text: Do not assume that redundant cooling systems provide protection against simultaneous failure, especially during extraordinarily high outside temperatures; the review records that multiple redundant cooling systems failed simultaneously and the data center could not maintain a safe operating temperature.
    evidence:
      - GCP-LDN-2022:S30
    since: 1.2.0
  - id: G-007
    text: Do not assume that automatic failover to standby cooling will work; the review records that standby chillers shared the same water circulation system as the active chillers, so failover failed. Verify both automatic and manual failover effectiveness before relying on them.
    evidence:
      - ALI-HKG-2022:S73
      - ALI-HKG-2022:S80
    since: 1.3.0
  - id: G-008
    text: Do not rely on the fire sprinkler system as a safe thermal limit; the review records that sprinkler activation due to high temperature caused water damage to power supply cabinets and server racks, complicating restoration.
    evidence:
      - ALI-HKG-2022:S18
      - ALI-HKG-2022:S83
    since: 1.3.0
open_questions:
  - id: Q-001
    question: What is the safe operational temperature threshold for this datacenter, and what is the expected time from thermal buffer depletion to that threshold under the site's load-dependent thermal buffer design?
    why: The review refers to safe operational thresholds and a load-dependent thermal buffer but gives no numbers, so a duty team cannot judge how much time it has before automated shutdowns and hardware damage begin.
    raised_by: AZ-SCUS-2018
    since: 1.0.0
  - id: Q-002
    question: What specific recovery procedures must be followed after a cooling failure that damaged storage servers, network devices and power units, and who decides when the datacenter is safe to return to normal operation?
    why: The review calls for a thorough review of the datacenter recovery procedures but does not state what those procedures are or who owns the decision.
    raised_by: AZ-SCUS-2018
    since: 1.0.0
  - id: Q-003
    question: What hardware design changes to storage scale units are required to increase resiliency to environmental factors such as rapid temperature rise?
    why: The review identifies an evaluation of future hardware design of storage scale units as a remediation theme but does not specify the design requirements.
    raised_by: AZ-SCUS-2018
    since: 1.0.0
  - id: Q-004
    question: What is the maximum time the site can run with cooling down before hardware damage or customer impact, and what temperature or time threshold should trigger escalation and manual PLC reset?
    why: The review describes temperatures rising and servers powering off but gives no threshold or time limit; the pill cannot tell a duty team when to escalate without a number that is not in the cited sentences.
    raised_by: AWS-NRT-2019
    since: 1.1.0
  - id: Q-005
    question: What is the approved procedure and authority for manually resetting PLCs and air handling units when the control system is unavailable, and who decides to do it?
    why: The review records that the team had to manually investigate and reset equipment, but does not state the procedure, the authority, or the decision trigger; the pill must not guess these.
    raised_by: AWS-NRT-2019
    since: 1.1.0
  - id: Q-006
    question: How should operators identify and remediate this specific control-system failover bug, and what evidence confirms the situation has recurred?
    why: The review states local operations teams were trained to quickly identify and remediate this situation, but does not describe the identifying signs or the remediation steps; the pill cannot encode them without that detail.
    raised_by: AWS-NRT-2019
    since: 1.1.0
  - id: Q-007
    question: What specific outside temperature threshold or combination of conditions should trigger preemptive thermal load reduction or shutdown planning when redundant cooling systems are compromised?
    why: The review cites extraordinarily high outside temperatures as a contributing factor but does not specify a threshold; without this, the pill cannot guide when to act before a full shutdown is required.
    raised_by: GCP-LDN-2022
    since: 1.2.0
  - id: Q-008
    question: What are the criteria and decision process for progressively decreasing thermal load within a data center space, including which workloads to curtail and in what order?
    why: The review commits to investigating more advanced methods but does not provide operational details; the pill needs expert guidance to implement progressive load reduction safely and effectively.
    raised_by: GCP-LDN-2022
    since: 1.2.0
  - id: Q-009
    question: What are the specific temperature thresholds and time limits for deciding when to shut down servers and when to power off server rooms during a cooling failure?
    why: The review states the contingency plan will clarify when servers must be shut down and server rooms powered off, but does not give the thresholds or time limits needed to make that decision.
    raised_by: ALI-HKG-2022
    since: 1.3.0
  - id: Q-010
    question: What additional fine-grained metrics should be monitored to detect air ingress or water loss in the cooling system earlier, and what are their alarm thresholds?
    why: The review commits to expanding monitoring scope for more efficient troubleshooting, but does not specify which metrics or thresholds would have detected the root cause sooner.
    raised_by: ALI-HKG-2022
    since: 1.3.0
